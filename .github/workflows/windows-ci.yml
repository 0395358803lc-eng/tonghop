name: Windows CI

on:
  push:
    branches:
      - main
      - desktop-windows
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Ensure FFmpeg for media tests
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            $chocoBin = 'C:\ProgramData\chocolatey\bin'
            $chocoFfmpeg = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg*\tools' -Recurse -File -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($chocoFfmpeg) {
              $ffmpegDir = $chocoFfmpeg.DirectoryName
              $ffmpegDir >> $env:GITHUB_PATH
              $env:PATH = "$ffmpegDir;$env:PATH"
            } elseif (Test-Path $chocoBin) {
              $chocoBin >> $env:GITHUB_PATH
              $env:PATH = "$chocoBin;$env:PATH"
            }
          }
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) {
            throw "FFmpeg is required for these tests and Chocolatey did not provide it (community feed outage). Re-run this workflow; if it repeats, pin a direct FFmpeg build URL instead of choco."
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Backend and Flow tests
        shell: pwsh
        # Step-scoped on purpose: a job-level setting would leak into the packaged-app
        # smoke steps, where the product must be allowed to open its own database.
        env:
          TH_MEDIA_REQUIRE_DB_ISOLATION: "1"
        run: |
          # The gate discovers the same module list as before, runs it with the DB isolation
          # tripwire on, then proves no real store moved: a suite that rewrote the acceptance
          # database would otherwise look green here.
          powershell -NoProfile -ExecutionPolicy Bypass -File 'desktop\scripts\backend_test_gate.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Backend/Flow isolation gate failed with exit code $LASTEXITCODE" }

      - name: Frontend build and lint
        shell: pwsh
        run: |
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { throw "Frontend build failed with exit code $LASTEXITCODE" }
          npm --prefix frontend run lint
          if ($LASTEXITCODE -ne 0) { throw "Frontend lint failed with exit code $LASTEXITCODE" }

      - name: Release script regression tests
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File 'desktop\scripts\test_runtime_dependency_resolution.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Runtime dependency resolution regression failed with exit code $LASTEXITCODE" }
          python desktop\test_portable_paths.py
          if ($LASTEXITCODE -ne 0) { throw "Portable path regression failed with exit code $LASTEXITCODE" }
          python desktop\test_migrate_legacy_data.py
          if ($LASTEXITCODE -ne 0) { throw "Legacy migration regression failed with exit code $LASTEXITCODE" }
          python desktop\test_acceptance_fingerprints.py
          if ($LASTEXITCODE -ne 0) { throw "Acceptance measurement regression failed with exit code $LASTEXITCODE" }

      - name: Rust tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'desktop\runtime','desktop\sidecars' | Out-Null
          Set-Location desktop\src-tauri
          cargo test
          cargo check
