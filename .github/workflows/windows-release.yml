name: Windows Full Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish/refresh GitHub Release after build"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      CARGO_INCREMENTAL: "0"
      HF_HUB_DISABLE_XET: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release metadata
        id: meta
        shell: pwsh
        run: |
          $cfg = Get-Content 'desktop\src-tauri\tauri.conf.json' -Raw | ConvertFrom-Json
          $version = [string]$cfg.version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Output "Building TH Media $version"

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = "v${{ steps.meta.outputs.version }}"
          $actual = "${{ github.ref_name }}"
          if ($actual -ne $expected) {
            throw "Tag $actual does not match tauri.conf.json version $expected"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Ensure FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }

          $ffmpeg = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg*\tools' -Recurse -File -Filter ffmpeg.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\bin\\ffmpeg\.exe$' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          $ffprobe = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg*\tools' -Recurse -File -Filter ffprobe.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\bin\\ffprobe\.exe$' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($ffmpeg -and $ffprobe) {
            "TH_MEDIA_FFMPEG_PATH=$($ffmpeg.FullName)" >> $env:GITHUB_ENV
            "TH_MEDIA_FFPROBE_PATH=$($ffprobe.FullName)" >> $env:GITHUB_ENV
            & $ffmpeg.FullName -version | Select-Object -First 1
            & $ffprobe.FullName -version | Select-Object -First 1
          } else {
            ffmpeg -version | Select-Object -First 1
            ffprobe -version | Select-Object -First 1
          }

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Run regression suite
        shell: pwsh
        run: |
          Set-Location backend
          $mods = @()
          $mods += Get-ChildItem 'app\test_*.py' | ForEach-Object { 'app.' + $_.BaseName }
          $mods += Get-ChildItem 'flow_bridge\test_*.py' | ForEach-Object { 'flow_bridge.' + $_.BaseName }
          python -m unittest $mods
          if ($LASTEXITCODE -ne 0) { throw "Backend/Flow regression failed with exit code $LASTEXITCODE" }
          Set-Location ..
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { throw "Frontend build failed with exit code $LASTEXITCODE" }
          npm --prefix frontend run lint
          if ($LASTEXITCODE -ne 0) { throw "Frontend lint failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path 'desktop\runtime','desktop\sidecars' | Out-Null
          Set-Location desktop\src-tauri
          cargo test
          if ($LASTEXITCODE -ne 0) { throw "Rust tests failed with exit code $LASTEXITCODE" }
          cargo check
          if ($LASTEXITCODE -ne 0) { throw "Rust check failed with exit code $LASTEXITCODE" }
          Set-Location ..\..
          powershell -NoProfile -ExecutionPolicy Bypass -File 'desktop\scripts\test_runtime_dependency_resolution.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Release script regression failed with exit code $LASTEXITCODE" }
          python desktop\test_portable_paths.py
          if ($LASTEXITCODE -ne 0) { throw "Portable path regression failed with exit code $LASTEXITCODE" }
          python desktop\test_migrate_legacy_data.py
          if ($LASTEXITCODE -ne 0) { throw "Legacy migration regression failed with exit code $LASTEXITCODE" }
          python desktop\test_acceptance_fingerprints.py
          if ($LASTEXITCODE -ne 0) { throw "Acceptance measurement regression failed with exit code $LASTEXITCODE" }
          "TH_MEDIA_GATE_REGRESSION=PASS" >> $env:GITHUB_ENV

      - name: Verify release publishing is permitted
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # A POST without tag_name answers 403 when the token may not create
          # releases and 422 when it may, so the write path is proven before the
          # build starts instead of after a full release attempt.
          $probe = gh api -X POST "repos/$env:GITHUB_REPOSITORY/releases" -f name=release-permission-probe 2>&1 | Out-String
          $summary = $probe.Trim() -replace '\s+', ' '
          if ($probe -match 'HTTP 403') {
            throw "GITHUB_TOKEN cannot create releases ($summary). Enable Settings -> Actions -> General -> Workflow permissions -> 'Read and write permissions', then re-run; failing here avoids a full build that cannot publish."
          }
          if ($probe -notmatch 'HTTP 422') {
            throw "Unexpected response while probing release permissions: $summary"
          }
          Write-Output "RELEASE_PUBLISH_PERMISSION=OK"

      - name: Optional Authenticode certificate
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.TH_MEDIA_CODE_SIGN_PFX_B64 }}
          PFX_PASSWORD: ${{ secrets.TH_MEDIA_CODE_SIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            "TH_MEDIA_REQUIRE_CODE_SIGN=0" >> $env:GITHUB_ENV
            "TH_MEDIA_SIGNING_STATUS=UNSIGNED_NO_CERTIFICATE" >> $env:GITHUB_ENV
            Write-Warning "No production code-signing certificate secret is configured. Release will be unsigned."
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP 'th-media-code-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $secure = ConvertTo-SecureString ($env:PFX_PASSWORD ?? '') -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation 'Cert:\CurrentUser\My' -Password $secure
          if (-not $cert -or -not $cert.HasPrivateKey) {
            throw 'Imported code-signing certificate does not have a private key.'
          }
          "TH_MEDIA_CODE_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          "TH_MEDIA_REQUIRE_CODE_SIGN=1" >> $env:GITHUB_ENV
          "TH_MEDIA_SIGNING_STATUS=SIGNED" >> $env:GITHUB_ENV
          Remove-Item $pfx -Force

      - name: Build Tauri executable and release resources
        shell: pwsh
        run: |
          Set-Location desktop
          npm run tauri -- build --no-bundle

      - name: Sign executable and sidecars before bundle
        if: env.TH_MEDIA_SIGNING_STATUS == 'SIGNED'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File 'desktop\scripts\sign_windows_release.ps1' -ProjectRoot . -Phase PreBundle

      - name: Bundle NSIS with offline WebView2
        shell: pwsh
        run: |
          Set-Location desktop
          npm run tauri -- bundle -b nsis

      - name: Sign installer after bundle
        if: env.TH_MEDIA_SIGNING_STATUS == 'SIGNED'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File 'desktop\scripts\sign_windows_release.ps1' -ProjectRoot . -Phase PostBundle
          powershell -NoProfile -ExecutionPolicy Bypass -File 'desktop\scripts\sign_windows_release.ps1' -ProjectRoot . -Phase Verify

      - name: Verify self-contained release resources
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $installer = "desktop\src-tauri\target\release\bundle\nsis\TH Media_" + $version + "_x64-setup.exe"
          if (-not (Test-Path $installer -PathType Leaf)) { throw "Installer missing: $installer" }

          $runtime = 'desktop\runtime'
          $required = @(
            "$runtime\bin\ffmpeg.exe",
            "$runtime\bin\ffprobe.exe",
            "$runtime\models\speaker\3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx",
            "$runtime\models\whisper\base\model.bin",
            "$runtime\models\whisper\base\config.json",
            "$runtime\models\whisper\base\tokenizer.json",
            "$runtime\browser\chromium\chrome.exe",
            'desktop\sidecars\th-media-backend\th-media-backend.exe',
            'desktop\sidecars\th-media-flow-bridge\th-media-flow-bridge.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Release dependency missing: $path" }
          }

          if ((Get-Item "$runtime\models\whisper\base\model.bin").Length -lt 50MB) {
            throw 'Bundled Whisper model is unexpectedly small.'
          }

          $nsi = 'desktop\src-tauri\target\release\nsis\x64\installer.nsi'
          if (-not (Test-Path $nsi -PathType Leaf)) { throw 'Generated NSIS script missing.' }
          $nsiText = Get-Content $nsi -Raw
          if ($nsiText -notmatch 'INSTALLWEBVIEW2MODE "offlineInstaller"') {
            throw 'NSIS installer is not configured for offline WebView2.'
          }
          Write-Output 'SELF_CONTAINED_RESOURCE_CHECK=PASS'
          "TH_MEDIA_GATE_SELF_CONTAINED=PASS" >> $env:GITHUB_ENV

      - name: Clean-machine runtime smoke
        shell: pwsh
        run: |
          $releaseDir = 'desktop\src-tauri\target\release'
          $stage = Join-Path $env:RUNNER_TEMP ("th-media-cleanroom-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $releaseDir 'th-media-desktop.exe') $stage -Force
          Copy-Item 'desktop\sidecars' (Join-Path $stage 'sidecars') -Recurse -Force
          Copy-Item 'desktop\runtime' (Join-Path $stage 'runtime') -Recurse -Force
          foreach ($probe in @("$stage\th-media-desktop.exe",
                               "$stage\sidecars\th-media-backend\th-media-backend.exe",
                               "$stage\sidecars\th-media-flow-bridge\th-media-flow-bridge.exe",
                               "$stage\runtime\bin\ffmpeg.exe",
                               "$stage\runtime\models\speaker\3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx",
                               "$stage\runtime\models\whisper\base\model.bin")) {
            if (-not (Test-Path $probe -PathType Leaf)) { throw "Clean-room staging missing: $probe" }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File 'desktop\scripts\clean_machine_smoke.ps1' -ReleaseRoot $stage
          $smokeExit = $LASTEXITCODE
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          if ($smokeExit -ne 0) { throw "Clean-machine runtime smoke failed with exit code $smokeExit" }
          "TH_MEDIA_GATE_CLEANROOM=PASS" >> $env:GITHUB_ENV

      - name: Installed Setup.exe smoke
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $installer = "desktop\src-tauri\target\release\bundle\nsis\TH Media_" + $version + "_x64-setup.exe"
          powershell -NoProfile -ExecutionPolicy Bypass -File 'desktop\scripts\installed_package_smoke.ps1' -Installer $installer
          $smokeExit = $LASTEXITCODE
          if ($smokeExit -ne 0) { throw "Installed Setup.exe smoke failed with exit code $smokeExit" }
          "TH_MEDIA_GATE_INSTALLED=PASS" >> $env:GITHUB_ENV

      - name: Create release hashes and status
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $installer = "desktop\src-tauri\target\release\bundle\nsis\TH Media_" + $version + "_x64-setup.exe"
          $shaPath = "$installer.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$hash  TH Media_$($version)_x64-setup.exe" | Set-Content -LiteralPath $shaPath -Encoding ascii
          $statusPath = "desktop\src-tauri\target\release\bundle\nsis\SIGNING_STATUS.txt"
          @(
            "TH Media $version",
            "Authenticode=$env:TH_MEDIA_SIGNING_STATUS",
            "WebView2=offlineInstaller",
            "WhisperBase=bundled",
            "FlowBrowser=Chrome_Edge_or_Bundled",
            "SHA256=$hash"
          ) | Set-Content -LiteralPath $statusPath -Encoding utf8
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "sha=$shaPath" >> $env:GITHUB_OUTPUT
          "status=$statusPath" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TH-Media-${{ steps.meta.outputs.version }}-Windows
          path: |
            ${{ steps.package.outputs.installer }}
            ${{ steps.package.outputs.sha }}
            ${{ steps.package.outputs.status }}
          if-no-files-found: error
          retention-days: 30

      - name: Require every release gate to pass
        shell: pwsh
        run: |
          $gates = [ordered]@{
            REGRESSION     = $env:TH_MEDIA_GATE_REGRESSION
            SELF_CONTAINED = $env:TH_MEDIA_GATE_SELF_CONTAINED
            CLEANROOM      = $env:TH_MEDIA_GATE_CLEANROOM
            INSTALLED      = $env:TH_MEDIA_GATE_INSTALLED
          }
          foreach ($gate in $gates.GetEnumerator()) {
            $state = $gate.Value
            if ([string]::IsNullOrWhiteSpace($state)) { $state = 'NOT_RUN' }
            Write-Output ("release gate {0} = {1}" -f $gate.Key, $state)
          }
          $missing = @($gates.GetEnumerator() | Where-Object { $_.Value -ne 'PASS' } | ForEach-Object { $_.Key })
          if ($missing.Count) {
            throw "Refusing to publish: release gates not PASS -> $($missing -join ', ')"
          }
          if ($env:TH_MEDIA_SIGNING_STATUS -notin @('SIGNED', 'UNSIGNED_NO_CERTIFICATE')) {
            throw "Refusing to publish: unexpected signing status '$env:TH_MEDIA_SIGNING_STATUS'"
          }
          Write-Output "RELEASE_GATES=ALL_PASS"

      - name: Publish or refresh GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $version = "${{ steps.meta.outputs.version }}"
          $installer = "${{ steps.package.outputs.installer }}"
          $sha = "${{ steps.package.outputs.sha }}"
          $status = "${{ steps.package.outputs.status }}"
          $notes = "desktop\RELEASE_NOTES_$version.md"
          if (-not (Test-Path $notes -PathType Leaf)) {
            throw "Release notes for this version are missing: $notes"
          }

          $existing = gh release view $tag 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists; refreshing its assets."
            gh release upload $tag $installer $sha $status --clobber
          } else {
            gh release create $tag $installer $sha $status --target "${{ github.sha }}" --title "TH Media Desktop $version" --notes-file $notes --latest
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing GitHub Release $tag failed with exit code $LASTEXITCODE : $($existing.Trim())"
          }
          Write-Output "GITHUB_RELEASE_PUBLISHED=$tag"
